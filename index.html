    <script>
      window.addEventListener('vite:preloadError', function () {
        window.location.reload();
      });
      window.nevaBootFailed = function () {
        document.getElementById('neva-boot-status').textContent = 'The coast could not open. Check your connection and reload the game.';
        var button = document.createElement('button'); button.textContent = 'Reload game'; button.onclick = function () { location.reload(); };
        document.getElementById('neva-boot-shell').appendChild(button);
      };
    </script>
    <div id="canvas-container">

    </div>
