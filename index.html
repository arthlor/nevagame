    <script>
      // The install prompt fires as soon as Chrome's installability rules pass,
      // which can be before React mounts. Capture it here so the lobby prompt
      // always has a real 1-tap install to hand to the player.
      window.__nevaDeferredInstallPrompt = null;
      window.__nevaAppInstalled = false;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__nevaDeferredInstallPrompt = event;
        window.dispatchEvent(new Event('neva:installprompt'));
      });
      window.addEventListener('appinstalled', function () {
        window.__nevaAppInstalled = true;
        window.__nevaDeferredInstallPrompt = null;
        window.dispatchEvent(new Event('neva:appinstalled'));
      });
      if ('serviceWorker' in navigator) {
        // A pass-through worker keeps the app installable on browsers that
        // still require a fetch handler; it never caches game assets or state.
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>

    <style>
      html,body { margin:0; background:#192b29; }
      /* Boot shell mirrors the React title composition (backdrop, bottom-left
         brand lockup, tagline) so the handoff to the lobby is a crossfade,
         not a restyle. Anything structural here must stay in sync with
         StartScreen's brand lockup; the shell carries no interaction. */
      #neva-boot-shell { position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; justify-content:flex-end; color:#fff1d3; background:linear-gradient(90deg,rgba(18,32,28,0.73) 0%,rgba(23,32,23,0.56) 28%,rgba(23,32,23,0.1) 64%,rgba(23,32,23,0.16) 100%),url('/assets/ui/neva-title-background.webp') center/cover; font-family:Georgia,'Times New Roman',serif; transition:opacity 320ms ease; }
      #neva-boot-shell.is-leaving { opacity:0; pointer-events:none; }
      /* Same content box as the React lobby so the lockup lands in place. */
      #neva-boot-continue { width:min(100%,1360px); margin:0 auto; padding:clamp(42px,7vw,96px) clamp(28px,7vw,112px) clamp(76px,10vh,112px); }
      #neva-boot-shell h1 { margin:0; color:#fffaf0; font-size:clamp(76px,10vw,147px); font-weight:500; letter-spacing:-0.065em; line-height:0.84; text-shadow:0 4px 22px rgba(13,21,15,0.36); }
      #neva-boot-brand-rule { display:block; width:72px; height:2px; margin:22px 0 0; background:#c9a75e; box-shadow:0 0 18px rgba(252,226,154,0.42); }
      #neva-boot-shell .neva-boot-tagline { margin:20px 0 0; color:#fff5db; font-size:clamp(19px,2vw,26px); letter-spacing:-0.02em; line-height:1.25; text-shadow:0 2px 12px rgba(13,21,15,0.34); }
      #neva-boot-status { margin:14px 0 0; color:rgba(255,250,240,0.78); font-size:14px; letter-spacing:0.015em; line-height:1.55; text-shadow:0 2px 10px rgba(13,21,15,0.32); }
      #neva-boot-shell button { width:max-content; padding:12px 24px; font:inherit; }
      #neva-boot-portrait { display:none; }
      /* A touch device in portrait must never see the loading lobby. `hover:
         none` covers phones/tablets that report a fine pointer. */
      @media (orientation: portrait) and (pointer: coarse), (orientation: portrait) and (hover: none) {
        #neva-boot-shell { justify-content:center; text-align:center; }
        #neva-boot-continue { display:none; }
        #neva-boot-portrait { display:block; }
      }
      @media (prefers-reduced-motion: reduce) {
        #neva-boot-shell { transition:none; }
      }
    </style>

  <body>
    <div id="neva-boot-shell" role="status">

      <div id="neva-boot-portrait"><h1>Turn your device sideways</h1><p>The coast is played in landscape.</p></div>
    </div>
    <script>
      var nevaPreloadAttemptKey = 'neva_preload_reload_at';
      function nevaPreloadAttempts(now) {
        try {
          var attempts = JSON.parse(sessionStorage.getItem(nevaPreloadAttemptKey) || '[]') || [];
          return attempts.filter(function (t) { return typeof t === 'number' && now - t < 60000; });
        } catch (e) {
          return [];
        }
      }
      function nevaResetPreloadAttempts() {
        try { sessionStorage.removeItem(nevaPreloadAttemptKey); } catch (e) {}
      }
      // A persistent missing chunk must not become an infinite reload loop, and
      // an unsaved session must not be silently reloaded forever. Two automatic
      // attempts per minute, then the visible recovery shell owns the choice.
      window.addEventListener('vite:preloadError', function (event) {
        var now = Date.now();
        var attempts = nevaPreloadAttempts(now);
        if (attempts.length >= 2) {
          event.preventDefault();
          window.nevaBootFailed();
          return;
        }
        attempts.push(now);
        try { sessionStorage.setItem(nevaPreloadAttemptKey, JSON.stringify(attempts)); } catch (e) {}
        window.location.reload();
      });
      window.nevaBootFailed = function () {
        var status = document.getElementById('neva-boot-status');
        if (status) status.textContent = 'The coast could not open. Check your connection and reload the game.';
        var continueBlock = document.getElementById('neva-boot-continue');
        if (continueBlock) continueBlock.style.display = 'block';
        var portraitBlock = document.getElementById('neva-boot-portrait');
        if (portraitBlock) portraitBlock.style.display = 'none';
        var shell = document.getElementById('neva-boot-shell');
        if (!shell || shell.querySelector('button')) return;
        var button = document.createElement('button'); button.textContent = 'Reload game';
        button.onclick = function () { nevaResetPreloadAttempts(); location.reload(); };
        shell.appendChild(button);
      };
    </script>
    <div id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts" onerror="window.nevaBootFailed()"></script>
