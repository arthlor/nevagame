<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neva Art Yard</title>
    <link rel="stylesheet" href="/src/art-yard/styles.css" />
  </head>
  <body>
    <main id="yard-app" aria-label="Neva interactive asset yard">
      <section class="yard-stage" aria-label="3D asset preview">
        <canvas id="yard-canvas"></canvas>
        <div id="yard-status" class="stage-status" role="status" aria-live="polite">Loading catalog…</div>
        <div id="yard-toast" class="stage-toast" role="status" aria-live="polite"></div>

        <div class="stage-hud" id="stage-hud">
          <span id="hud-asset-badge">Loading…</span>
          <span class="hud-sep" aria-hidden="true">·</span>
          <span id="hud-view-badge">3/4 · 8m</span>
          <span class="hud-sep" aria-hidden="true">·</span>
          <span id="hud-tris-badge">—</span>
        </div>

        <div class="stage-toolbar" aria-label="Camera">
          <button type="button" data-cam="front" title="Front (1)">Front</button>
          <button type="button" data-cam="three-quarter" class="active" title="3/4 (2)">3/4</button>
          <button type="button" data-cam="side" title="Side (3)">Side</button>
          <button type="button" data-cam="rear" title="Rear (4)">Rear</button>
          <button type="button" data-cam="top" title="Top (5)">Top</button>
          <button type="button" id="cam-fit-btn" title="Fit (F)">Fit</button>
          <button type="button" id="toggle-panel-btn" title="Toggle panel (Tab)">Hide</button>
        </div>
      </section>

      <aside class="yard-panel" id="yard-panel">
        <header class="panel-heading">
          <h1>Art Yard</h1>
          <a href="/" class="back-link">Game</a>
        </header>

        <section class="panel-asset" aria-labelledby="sec-asset">
          <div class="section-title-row">
            <h2 id="sec-asset">Asset</h2>
            <span class="count-badge" id="asset-count-badge">0</span>
          </div>

          <div class="asset-filter-row">
            <input id="asset-search" type="search" placeholder="Filter…" spellcheck="false" aria-label="Filter assets" />
            <select id="family-filter" aria-label="Family">
              <option value="all" selected>All</option>
              <option value="showcase">Showcases</option>
              <option value="architecture">Architecture</option>
              <option value="prop">Prop</option>
              <option value="boat">Boat</option>
              <option value="vegetation">Vegetation</option>
              <option value="crop">Crop</option>
              <option value="fish">Fish</option>
              <option value="character">Character</option>
              <option value="rock">Rock</option>
              <option value="cloud">Cloud</option>
            </select>
          </div>

          <label class="sr-only" for="asset-select">Active asset</label>
          <select id="asset-select" size="8" class="asset-select"></select>

          <div class="asset-nav-row">
            <button type="button" id="prev-asset-btn" title="Previous ([)">Prev</button>
            <button type="button" id="next-asset-btn" title="Next (])">Next</button>
            <button type="button" id="copy-asset-id-btn" title="Copy ID">Copy ID</button>
          </div>
        </section>

        <section class="panel-fold" id="animation-section" style="display: none;" aria-labelledby="sec-anim">
          <h2 id="sec-anim">Animation</h2>

          <label class="field-label" for="clip-select">Clip</label>
          <select id="clip-select"></select>

          <div class="anim-control-row">
            <button type="button" id="anim-play-toggle" class="anim-action-btn primary">Pause</button>
            <button type="button" id="anim-step-back-btn" class="anim-action-btn" title="Step back 0.1s">−0.1s</button>
            <button type="button" id="anim-step-fwd-btn" class="anim-action-btn" title="Step forward 0.1s">+0.1s</button>
            <div class="speed-select-wrap">
              <label for="anim-speed" class="sr-only">Speed</label>
              <select id="anim-speed" title="Playback speed">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="1.0" selected>1×</option>
                <option value="1.5">1.5×</option>
                <option value="2.0">2×</option>
              </select>
            </div>
          </div>

          <div class="scrubber-row">
            <label class="field-label" for="anim-scrubber">Time <output id="anim-time-output">0.00s / 0.00s</output></label>
            <input id="anim-scrubber" type="range" min="0" max="1" step="0.001" value="0" />
          </div>

          <label class="field-label" for="socket-prop-select">Hand prop</label>
          <select id="socket-prop-select">
            <option value="none">None</option>
            <option value="tool_fishing_rod_a">Fishing rod</option>
            <option value="tool_watering_can_a">Watering can</option>
            <option value="tool_sickle_a">Sickle</option>
            <option value="tool_seed_pouch_a">Seed pouch</option>
            <option value="prop_harvest_basket_a">Harvest basket</option>
            <option value="prop_crop_bundle_a">Crop bundle</option>
            <option value="tool_workstation_scoop_a">Scoop</option>
          </select>
        </section>

        <details class="panel-fold">
          <summary>View</summary>
          <label class="field-label" for="distance-range">Distance <output id="distance-output">8 m</output></label>
          <input id="distance-range" type="range" min="1" max="80" step="1" value="8" />
          <div class="chip-row" aria-label="Distance presets">
            <button type="button" data-dist="2">2m</button>
            <button type="button" data-dist="4">4m</button>
            <button type="button" data-dist="8">8m</button>
            <button type="button" data-dist="15">15m</button>
            <button type="button" data-dist="30">30m</button>
          </div>
          <div class="turntable-row">
            <label class="toggle-checkbox">
              <input id="turntable-toggle" type="checkbox" />
              <span>Rotate</span>
            </label>
            <div class="turntable-speed-wrap">
              <label for="turntable-speed" class="field-label-sm">Speed</label>
              <input id="turntable-speed" type="range" min="0.2" max="3" step="0.1" value="1.0" />
            </div>
          </div>
        </details>

        <details class="panel-fold">
          <summary>Shading</summary>
          <label class="field-label" for="shading-select">Mode</label>
          <select id="shading-select">
            <option value="lit" selected>Lit</option>
            <option value="wireframe_overlay">Wire overlay</option>
            <option value="wireframe_pure">Wire</option>
            <option value="vertex_colors">Vertex color</option>
            <option value="normals">Normals</option>
            <option value="lod0">LOD0</option>
            <option value="lod1">LOD1</option>
          </select>
          <div class="flag-row">
            <label class="toggle-checkbox">
              <input id="bounds-toggle" type="checkbox" />
              <span>Bounds</span>
            </label>
            <label class="toggle-checkbox">
              <input id="collision-toggle" type="checkbox" />
              <span>Collision</span>
            </label>
            <label class="toggle-checkbox">
              <input id="shadows-toggle" type="checkbox" checked />
              <span>Shadows</span>
            </label>
          </div>
        </details>

        <details class="panel-fold">
          <summary>Environment</summary>
          <label class="field-label" for="time-range">Time <output id="time-output">12:00</output></label>
          <input id="time-range" type="range" min="0" max="1439" step="1" value="720" />
          <div class="chip-row" aria-label="Time presets">
            <button type="button" data-time="480">8:00</button>
            <button type="button" data-time="720">12:00</button>
            <button type="button" data-time="1020">17:00</button>
            <button type="button" data-time="1110">18:30</button>
            <button type="button" data-time="1180">19:40</button>
            <button type="button" data-time="1320">22:00</button>
          </div>
          <label class="field-label" for="azimuth-range">Azimuth <output id="azimuth-output">45°</output></label>
          <input id="azimuth-range" type="range" min="0" max="360" step="5" value="45" />
          <div class="env-row">
            <div>
              <label class="field-label" for="weather-select">Weather</label>
              <select id="weather-select">
                <option value="clear">Clear</option>
                <option value="fog">Fog</option>
                <option value="storm">Storm</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="ground-select">Ground</label>
              <select id="ground-select">
                <option value="grass" selected>Grass</option>
                <option value="sand">Sand</option>
                <option value="rock">Rock</option>
                <option value="grid">Grid</option>
                <option value="none">None</option>
              </select>
            </div>
          </div>
          <label class="toggle-checkbox water-toggle">
            <input id="water-toggle" type="checkbox" />
            <span>Water</span>
          </label>
        </details>

        <details class="panel-fold">
          <summary>Metrics <span class="count-badge" id="source-badge">published</span></summary>
          <div class="stage-input-row">
            <input id="stage-input" type="text" placeholder="published or run-…" spellcheck="false" aria-label="Art stage" />
            <button id="stage-apply" type="button">Apply</button>
          </div>
          <dl id="metrics-list" class="metrics-grid"></dl>
        </details>
      </aside>
    </main>

    <script type="module" src="/src/art-yard/main.ts"></script>
  </body>
</html>
